services:
  - type: web
    name: bridge-escrow-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: hosted
      - key: MPESA_ENV
        value: sandbox
      - key: SEED_DEMO_DATA
        value: 'true'
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bridge-escrow-db
          property: connectionString

databases:
  - name: bridge-escrow-db
    plan: free
    databaseName: bridge_escrow
    user: bridge_escrow
