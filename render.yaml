services:
  - type: web
    name: bridge-escrow-api
    runtime: python
    rootDir: backend
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -m flask --app app init-db && gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /api/health
    disk:
      name: bridge-escrow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: hosted
      - key: MPESA_ENV
        value: sandbox
      - key: SEED_DEMO_DATA
        value: 'true'
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/bridge_escrow.db
